# thomasblalock.com — single-server gateway
#
# Layout (after sub-agents fill in their components):
#   /                  → src/home/index.html
#   /resume/           → src/resume/index.html
#   /projects/         → src/projects/index.html  (or per-project sub-dirs)
#   /essays/           → src/essays/index.html    (list)
#   /essays/<slug>/    → src/essays/<slug>/index.html  (rendered essay)
#   /contact/          → src/contact/index.html
#   /shared/*          → src/shared/*  (CSS, nav, JS, STYLE.md, BOILERPLATE.html)
#   /images/*          → images/ (sibling mount)
#   *.md               → text/plain; charset utf-8
#
# Trailing slashes are normalized by issuing a permanent redirect on the no-slash
# variant — keeps relative URLs inside each tab's index.html behaving consistently.

server {
    listen 80 default_server;
    server_name _;

    root  /srv/site;
    index index.html;

    # Markdown should render as text in the browser, not download.
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    # Sibling-mounted images — exposed at /images/
    location /images/ {
        alias /srv/images/;
        access_log off;
        expires 7d;
    }

    # llms.txt convention: AI crawlers look at the site root for /llms.txt.
    # The source of truth lives at src/llms/llms.txt so it's editable like any
    # other tab, but the canonical URL is /llms.txt.
    location = /llms.txt {
        alias /srv/site/llms/llms.txt;
        default_type text/plain;
        charset utf-8;
    }

    # Landing — serve home/index.html at the root without changing the URL.
    location = / {
        try_files /home/index.html =404;
    }

    # Canonicalize tab URLs to have a trailing slash so relative paths inside
    # each tab's index.html resolve predictably.
    location = /resume   { return 301 /resume/;   }
    location = /projects { return 301 /projects/; }
    location = /essays   { return 301 /essays/;   }
    location = /contact  { return 301 /contact/;  }

    # Everything else: try the literal path, then the directory's index.html.
    # Subdirectory tabs (/resume/, /projects/, /essays/, /essays/<slug>/, /contact/),
    # shared assets (/shared/styles.css, /shared/nav.html, /shared/shell.js),
    # and any component-local files (page.css, images, etc.) are all served here.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Surface a clearer message when a sub-agent hasn't delivered its index.html
    # yet. 403 covers the case where the tab's directory exists but has no
    # index.html (autoindex is off so nginx would otherwise return Forbidden).
    error_page 403 404 = @placeholder;
    location @placeholder {
        default_type text/html;
        charset utf-8;
        return 404 '<!doctype html><meta charset="utf-8"><title>Not built yet</title><body style="font: 16px/1.55 -apple-system, system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 24px; color: #16110b; background: #f7f4ee;"><h1 style="font-family: Georgia, serif;">Not built yet</h1><p>No <code>index.html</code> exists at <code>$uri</code> yet. If you are looking at this in development, the corresponding tab in <code>src/</code> has not been populated by its sub-agent. Each tab subdirectory contains a <code>README.md</code> describing the contract.</p><p><a href="/" style="color: #b3331f">← home</a></p></body>';
    }
}
