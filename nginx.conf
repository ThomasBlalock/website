# thomasblalock.com — local dev mirror of the GitHub Pages layout.
#
# Production is served by GitHub Pages directly out of the repo root, so this
# nginx config exists only to give the same URL shape locally via docker-compose.
# Keep it dumb: no aliases, no rewrites — just serve files from the repo root
# the way Pages does.

server {
    listen 80 default_server;
    server_name _;

    root  /srv/site;
    index index.html;

    # Markdown should render as text in the browser, not download.
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    # llms.txt — plain text.
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
    }

    # Canonicalize tab URLs to have a trailing slash so relative paths inside
    # each tab's index.html resolve predictably.
    location = /resume   { return 301 /resume/;   }
    location = /projects { return 301 /projects/; }
    location = /essays   { return 301 /essays/;   }
    location = /contact  { return 301 /contact/;  }

    # Try the literal path, then the directory's index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
